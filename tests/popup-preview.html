<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat Tidy</title><link rel="stylesheet" href="../src/popup.css"></head>
<body><div class="popup-shell"><header><div class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-6 4V5a1 1 0 0 1 1-1Z"/><path d="m7 9 1.5 1.5L11 8m2 1h4m-10 4h10"/></svg></div><div><h1>Chat Tidy <span>1.8.9</span></h1><p data-i18n="subtitle"></p></div><a class="repository-link" href="https://github.com/redPeak5421/chat-tidy" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><picture><source srcset="../icons/github-white.svg" media="(prefers-color-scheme: dark)"><img src="../icons/github-black.svg" width="20" height="20" alt="" aria-hidden="true"></picture></a></header>
<main><section class="settings"><label class="toggle-row"><span data-i18n="enabled"></span><input id="enabled" type="checkbox" role="switch"></label>
<label class="toggle-row" id="grok-options" hidden><span class="copy"><span data-i18n="grokShowAll"></span><small data-i18n="grokShowAllHint"></small></span><input id="grokShowAll" type="checkbox" role="switch"></label><div class="setting-items"><div class="setting-item"><label class="field" for="language"><span class="copy"><span data-i18n="language"></span></span><select id="language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="fr">Français</option><option value="ja">日本語</option><option value="ru">Русский</option></select></label></div>
<div class="setting-item"><div class="field"><span class="copy"><span id="mode-label" data-i18n="checkboxMode"></span><small data-i18n="modeHint"></small></span><div class="segments" id="checkboxMode" role="radiogroup" aria-labelledby="mode-label"><label><input type="radio" name="checkboxMode" value="always"><span data-i18n="alwaysMode"></span></label><label><input type="radio" name="checkboxMode" value="dynamic"><span data-i18n="dynamicMode"></span></label></div></div></div>
<div class="setting-item"><div class="field"><span class="copy"><span id="concurrency-label" data-i18n="concurrency"></span><small data-i18n="concurrencyHelp"></small></span><div class="segments numbers" id="concurrency" role="radiogroup" aria-labelledby="concurrency-label"><label><input type="radio" name="concurrency" value="1"><span>1</span></label><label><input type="radio" name="concurrency" value="2"><span>2</span></label><label><input type="radio" name="concurrency" value="3"><span>3</span></label></div></div></div></div>
</section>
<details><summary data-i18n="help"></summary><ol><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li></ol><p class="note" data-i18n="scope"></p></details>
<p class="refresh" data-i18n="refresh"></p><p class="privacy" data-i18n="privacy"></p><details class="support-section"><summary data-i18n="supportTitle"></summary><div class="support-cards">
<a class="support-card support-kofi" href="https://ko-fi.com/U2C326XLKJ" target="_blank" rel="noopener noreferrer" data-support="kofi"><span class="support-symbol" aria-hidden="true"><img src="../icons/kofi-logo.png" width="26" height="26" alt="" /></span><span class="support-copy"><strong>Ko-fi</strong><small data-i18n="supportPanel"></small></span><span class="support-arrow" aria-hidden="true">↗</span></a>
<a class="support-card support-afdian" href="https://afdian.com/a/redPeak5421" target="_blank" rel="noopener noreferrer" data-support="afdian"><span class="support-symbol" aria-hidden="true"><img src="../icons/afdian-logo.png" width="26" height="26" alt="" /></span><span class="support-copy"><strong data-i18n="afdianName"></strong><small data-i18n="supportTab"></small></span><span class="support-arrow" aria-hidden="true">↗</span></a>
</div></details><p id="saved" role="status" aria-live="polite"></p></main>
<script src="../src/core.js"></script><script src="preview.js"></script><script src="../src/i18n.js"></script><script src="../src/popup.js"></script></div></body></html>
