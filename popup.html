<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat Tidy</title><link rel="stylesheet" href="src/popup.css"></head>
<body><header><div class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-6 4V5a1 1 0 0 1 1-1Z"/><path d="m7 9 1.5 1.5L11 8m2 1h4m-10 4h10"/></svg></div><div><h1>Chat Tidy <span>1.5.4</span></h1><p data-i18n="subtitle"></p></div><a class="repository-link" href="https://github.com/redPeak5421/chat-tidy" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><picture><source srcset="icons/github-white.svg" media="(prefers-color-scheme: dark)"><img src="icons/github-black.svg" width="20" height="20" alt="" aria-hidden="true"></picture></a></header>
<main><section class="settings"><label class="toggle-row"><span data-i18n="enabled"></span><input id="enabled" type="checkbox" role="switch"></label>
<div class="setting-items"><div class="setting-item"><label class="field" for="language"><span data-i18n="language"></span><select id="language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="fr">Français</option><option value="ja">日本語</option><option value="ru">Русский</option></select></label></div>
<div class="setting-item"><div class="field"><span id="mode-label" data-i18n="checkboxMode"></span><div class="segments" id="checkboxMode" role="radiogroup" aria-labelledby="mode-label"><label><input type="radio" name="checkboxMode" value="always"><span data-i18n="alwaysMode"></span></label><label><input type="radio" name="checkboxMode" value="dynamic"><span data-i18n="dynamicMode"></span></label></div></div><p class="mode-hint" data-i18n="modeHint"></p></div>
<div class="setting-item"><div class="field"><span id="concurrency-label" data-i18n="concurrency"></span><div class="segments numbers" id="concurrency" role="radiogroup" aria-labelledby="concurrency-label"><label><input type="radio" name="concurrency" value="1"><span>1</span></label><label><input type="radio" name="concurrency" value="2"><span>2</span></label><label><input type="radio" name="concurrency" value="3"><span>3</span></label></div></div><small data-i18n="concurrencyHelp"></small></div></div>
</section>
<details><summary data-i18n="help"></summary><ol><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li></ol><p class="note" data-i18n="scope"></p></details>
<p class="refresh" data-i18n="refresh"></p><p class="privacy" data-i18n="privacy"></p><p id="saved" role="status" aria-live="polite"></p><details class="diagnostics"><summary data-i18n="diagnostics"></summary><p data-i18n="diagnosticHelp"></p><div class="diagnostic-actions"><button type="button" data-diagnostic="start" data-i18n="diagnosticStart"></button><button type="button" data-diagnostic="report" data-i18n="diagnosticExport"></button><button type="button" data-diagnostic="stop" data-i18n="diagnosticStop"></button></div><p id="diagnostic-status" role="status"></p></details></main>
<script src="src/i18n.js"></script><script src="src/popup.js"></script></body></html>
