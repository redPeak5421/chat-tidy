<main><section class="settings"><label class="toggle-row"><span data-i18n="enabled"></span><input id="enabled" type="checkbox" role="switch"></label>
<div class="setting-items"><div class="setting-item"><label class="field" for="language"><span data-i18n="language"></span><select id="language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="fr">Français</option><option value="ja">日本語</option><option value="ru">Русский</option></select></label></div>
