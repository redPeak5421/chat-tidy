<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat Tidy</title><link rel="stylesheet" href="src/popup.css"></head>
<body><header><div class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-6 4V5a1 1 0 0 1 1-1Z"/><path d="m7 9 1.5 1.5L11 8m2 1h4m-10 4h10"/></svg></div><div><h1>Chat Tidy <span>1.5.1</span></h1><p data-i18n="subtitle"></p></div><a class="repository-link" href="https://github.com/redPeak5421/chat-tidy" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 .1.66 2.55 3.28 1.82.1-.73.39-1.23.71-1.51-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.64 0c2.15-1.45 3.1-1.15 3.1-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.64 5.28-5.15 5.56.4.35.76 1.04.76 2.1v3.2c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg></a></header>
<main><section class="settings"><label class="toggle-row"><span data-i18n="enabled"></span><input id="enabled" type="checkbox" role="switch"></label>
<label class="field" for="language"><span data-i18n="language"></span><select id="language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="fr">Français</option><option value="ja">日本語</option><option value="ru">Русский</option></select></label>
<div class="field"><span id="mode-label" data-i18n="checkboxMode"></span><div class="segments" id="checkboxMode" role="radiogroup" aria-labelledby="mode-label"><label><input type="radio" name="checkboxMode" value="always"><span data-i18n="alwaysMode"></span></label><label><input type="radio" name="checkboxMode" value="dynamic"><span data-i18n="dynamicMode"></span></label></div></div><p class="mode-hint" data-i18n="modeHint"></p>
<div class="field"><span id="concurrency-label" data-i18n="concurrency"></span><div class="segments numbers" id="concurrency" role="radiogroup" aria-labelledby="concurrency-label"><label><input type="radio" name="concurrency" value="1"><span>1</span></label><label><input type="radio" name="concurrency" value="2"><span>2</span></label><label><input type="radio" name="concurrency" value="3"><span>3</span></label></div></div><small data-i18n="concurrencyHelp"></small>
</section>
<details><summary data-i18n="help"></summary><ol><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li></ol><p class="note" data-i18n="scope"></p></details>
<p class="refresh" data-i18n="refresh"></p><p class="privacy" data-i18n="privacy"></p><p id="saved" role="status" aria-live="polite"></p></main>
<script src="src/i18n.js"></script><script src="src/popup.js"></script></body></html>
